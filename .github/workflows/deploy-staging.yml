name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_NAME: ${{ vars.APP_NAME }}
      APP_ENV: staging
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_API_URL: /api
      VITE_APP_ENV: staging
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare web build env
        run: |
          cat <<EOF > .env
          APP_ENV=${APP_ENV}
          VITE_API_URL=/api
          VITE_APP_ENV=${VITE_APP_ENV}
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}
          VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}
          EOF

      - name: Verify boilerplate contract
        run: pnpm verify:boilerplate

      - name: Validate release env
        run: pnpm web:edge:release:check

      - name: Validate deploy env
        run: pnpm web:edge:deploy:check

      - name: Build web worker assets
        run: pnpm --filter @imsys/web build

      - name: Render Wrangler config
        run: node scripts/render-web-wrangler-config.mjs --env staging --out apps/web/wrangler.ci.jsonc

      - name: Sync Worker secret
        run: |
          printf "%s" "$SUPABASE_SERVICE_ROLE_KEY" \
            | pnpm --dir apps/web exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.ci.jsonc --env staging
          printf "%s" "$SENTRY_DSN" \
            | pnpm --dir apps/web exec wrangler secret put SENTRY_DSN --config wrangler.ci.jsonc --env staging

      - name: Deploy staging Worker
        run: pnpm --filter @imsys/web exec wrangler deploy --config wrangler.ci.jsonc --env staging
